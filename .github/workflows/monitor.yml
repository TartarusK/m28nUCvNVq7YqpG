name: Monitor TikTok LIVE

on:
  workflow_dispatch:
  
permissions:
  contents: read
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install monitor dependency
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Check users and dispatch recorders
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_USERS: ${{ vars.TIKTOK_USERS }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$TARGET_USERS" || { echo 'Define the TIKTOK_USERS repository variable'; exit 1; }
          # Comma-separated usernames become separate arguments.
          IFS=',' read -ra USERS <<< "$TARGET_USERS"
          python check_live.py "${USERS[@]}" > live.json || true
          cat live.json
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ['REPOSITORY']
          
          print("Revisando tareas activas en GitHub...")
          cmd_prog = ['gh', 'run', 'list', '--workflow', 'record.yml', '--state', 'in_progress', '--json', 'displayTitle']
          cmd_queue = ['gh', 'run', 'list', '--workflow', 'record.yml', '--state', 'queued', '--json', 'displayTitle']
          
          # Obtenemos los títulos de las grabaciones vivas
          activos = subprocess.run(cmd_prog, capture_output=True, text=True).stdout.lower()
          en_cola = subprocess.run(cmd_queue, capture_output=True, text=True).stdout.lower()
          titulos_ocupados = activos + en_cola
          
          for item in json.load(open('live.json')):
              if item['live']:
                  user = item['username'].lower()
                  
                  # Si el usuario ya está en el título de una tarea activa, lo saltamos
                  if user in titulos_ocupados:
                      print(f"Skipping @{item['username']} - ¡Ya hay una grabación en proceso o en cola!")
                  else:
                      print(f"Dispatching recorder for @{item['username']}")
                      subprocess.run([
                          'gh', 'workflow', 'run', 'record.yml', '--repo', repo,
                          '-f', f"username={item['username']}"
                      ], check=True)
          PY
