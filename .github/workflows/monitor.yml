name: Monitor TikTok LIVE

on:
  workflow_dispatch:
  
permissions:
  contents: read
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install monitor dependency
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Check users and dispatch recorders
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_USERS: ${{ vars.TIKTOK_USERS }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$TARGET_USERS" || { echo 'Define the TIKTOK_USERS repository variable'; exit 1; }
          # Comma-separated usernames become separate arguments.
          IFS=',' read -ra USERS <<< "$TARGET_USERS"
          python check_live.py "${USERS[@]}" > live.json || true
          cat live.json
          python - <<'PY'
          import json, os, subprocess, sys
          repo = os.environ['REPOSITORY']
          
          print("\nConsultando tareas activas directamente a la API de GitHub...")
          cmd = ['gh', 'api', f"/repos/{repo}/actions/workflows/record.yml/runs", '-X', 'GET', '-F', 'per_page=30']
          result = subprocess.run(cmd, capture_output=True, text=True)
          
          if result.returncode != 0:
              print(f"Error consultando la API: {result.stderr}")
              sys.exit(1)
              
          data = json.loads(result.stdout)
          runs = data.get('workflow_runs', [])
          
          activos = []
          estados = ['in_progress', 'queued', 'pending', 'requested']
          for r in runs:
              if r.get('status') in estados:
                  # Buscamos el nombre del usuario en el título de la tarea
                  titulo = (r.get('display_title') or r.get('name') or '').lower()
                  activos.append(titulo)
                  
          print(f"Grabaciones actualmente activas: {activos}\n")
          
          for item in json.load(open('live.json')):
              if item['live']:
                  user = item['username'].lower()
                  
                  if any(user in titulo for titulo in activos):
                      print(f"✅ Skipping @{item['username']} - ¡Ya hay una grabación activa o en cola!")
                  else:
                      print(f"🚀 Dispatching recorder for @{item['username']}")
                      subprocess.run([
                          'gh', 'workflow', 'run', 'record.yml', '--repo', repo,
                          '-f', f"username={item['username']}"
                      ], check=True)
          PY
