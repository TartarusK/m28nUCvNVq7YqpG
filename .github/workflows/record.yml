name: Record TikTok LIVE

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'TikTok Username to record'
        required: true
        type: string

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 360 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & Rclone)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

      - name: Setup Rclone Configuration
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" | base64 --decode > ~/.config/rclone/rclone.conf
          
      - name: Clone TikTok-Live-Recorder
        run: |
          git clone https://github.com/Michele0303/tiktok-live-recorder.git /tmp/recorder
          pip install uv

      - name: Record until the LIVE ends or the runner limit approaches
        env:
          USERNAME: ${{ inputs.username }}
          COOKIES_JSON: ${{ secrets.TIKTOK_COOKIES_JSON }}
        run: |
          mkdir -p recordings
          # Guardamos la ruta principal para no perder de vista los videos
          RUTA_PRINCIPAL=$(pwd)
          
          if [ -n "$COOKIES_JSON" ]; then
            echo "$COOKIES_JSON" > "$RUTA_PRINCIPAL/cookies.json"
            echo "$COOKIES_JSON" > /tmp/recorder/cookies.json
          fi
          
          # Entramos a la carpeta del grabador para que 'uv' funcione sin llorar
          cd /tmp/recorder
          uv run python src/main.py \
            -user "$USERNAME" \
            -mode manual \
            -duration 20400 \
            -output "$RUTA_PRINCIPAL/recordings" \
            -no-update-check

      - name: Upload to Google Drive
        if: always()
        run: |
          rclone copy recordings/ gdrive:tiktok-live \
            --progress \
            --transfers 4 \
            --checkers 8 \
            --ignore-existing

      - name: Retain short-lived recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-recording-${{ inputs.username }}-${{ github.run_id }}
          path: recordings/*.mp4
          retention-days: 1
