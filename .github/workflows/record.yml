name: Record TikTok LIVE
run-name: Grabando a @${{ inputs.username }}

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'TikTok Username to record'
        required: true
        type: string

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 360 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Rclone)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

      - name: Setup Rclone Configuration
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" | base64 --decode > ~/.config/rclone/rclone.conf
    
      - name: Enmascarar IP con Cloudflare WARP (VPN Gratis)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install cloudflare-warp -y
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          sleep 5
          echo "🌐 IP actual camuflada:"
          curl ifconfig.me
      
      - name: Clone TikTok-Live-Recorder
        run: |
          git clone https://github.com/Michele0303/tiktok-live-recorder.git /tmp/recorder
          pip install uv

      - name: Record until the LIVE ends or the runner limit approaches
        env:
          USERNAME: ${{ inputs.username }}
          COOKIES_JSON: ${{ secrets.TIKTOK_COOKIES_JSON }}
        run: |
          mkdir -p recordings
          RUTA_PRINCIPAL=$(pwd)
          
          # 1. Entramos a la carpeta del grabador primero
          cd /tmp/recorder
          
          # 2. Inyectamos el JSON de forma segura para no romper el formato
          if [ -n "$COOKIES_JSON" ]; then
            cat <<< "$COOKIES_JSON" > cookies.json
            echo "🔍 Verificando archivo de cookies:"
            ls -lh cookies.json
          else
            echo "⚠️ ADVERTENCIA: El secret TIKTOK_COOKIES_JSON está vacío."
          fi
          
          # 3. Ejecutamos el script
          uv run --python 3.11 python src/main.py \
            -user "$USERNAME" \
            -mode manual \
            -duration 20400 \
            -output "$RUTA_PRINCIPAL/recordings" \
            -no-update-check

      - name: Repair Corrupted MP4 with FFmpeg
        if: always()
        run: |
          cd recordings
          for file in *.mp4; do
            # Verifica que el archivo exista para evitar errores
            if [ -f "$file" ]; then
              echo "🛠️ Reparando índice de: $file"
              # Renombramos el original temporalmente
              mv "$file" "corrupto_$file"
              # Usamos FFmpeg para copiar el video/audio ignorando errores y creando un índice nuevo y limpio
              ffmpeg -err_detect ignore_err -i "corrupto_$file" -c copy "$file" || true
              # Borramos el archivo corrupto para no gastar espacio
              rm "corrupto_$file"
            fi
          done

      - name: Upload to Google Drive
        if: always()
        run: |
          rclone copy recordings/ gdrive:tiktok-live \
            --progress \
            --transfers 4 \
            --checkers 8 \
            --ignore-existing

      - name: Retain short-lived recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-recording-${{ inputs.username }}-${{ github.run_id }}
          path: recordings/*.mp4
          retention-days: 1
