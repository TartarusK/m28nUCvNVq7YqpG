name: Monitor TikTok LIVE

on:
  workflow_dispatch:
  
permissions:
  contents: read
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install monitor dependency
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Check users and dispatch recorders
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_USERS: ${{ vars.TIKTOK_USERS }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$TARGET_USERS" || { echo 'Define the TIKTOK_USERS repository variable'; exit 1; }
          # Comma-separated usernames become separate arguments.
          IFS=',' read -ra USERS <<< "$TARGET_USERS"
          python check_live.py "${USERS[@]}" > live.json || true
          cat live.json
          python - <<'PY'
          import json, os, subprocess
          for item in json.load(open('live.json')):
              if item['live']:
                  print(f"Dispatching recorder for @{item['username']}")
                  subprocess.run([
                      'gh', 'workflow', 'run', 'record.yml', '--repo', os.environ['REPOSITORY'],
                      '-f', f"username={item['username']}"
                  ], check=True)
          PY


